# Gradle 8.3 работает на Java 17-20.
#
# Если сборка падает с ошибкой
#   "Unsupported class file major version 69"
# значит Flutter запускает Gradle на слишком новой Java (69 = Java 25).
# Решение:  flutter config --jdk-dir "путь к JDK 17"
#
# Нужна Java 21 или 22? Замените ниже 8.3 на 8.9 — этой версии
# проект тоже соответствует, она просто требует больше памяти.
# Подробности: docs/ОШИБКА_СБОРКИ.md
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
