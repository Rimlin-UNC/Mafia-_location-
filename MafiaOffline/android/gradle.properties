# Настройки под окружение с малым объёмом ОЗУ (~1.3 ГБ свободно, без swap).
#
# Главный принцип: в один момент времени работает ОДИН процесс с кучей.
# Kotlin-компилятор запускается внутри Gradle (in-process) — отдельный
# демон потребовал бы вторую кучу, и вдвоём они не помещаются: OOM killer
# убивает Gradle с сообщением "daemon disappeared unexpectedly".
#
# На машине с 8+ ГБ ОЗУ смело меняйте на:
#   org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
#   kotlin.compiler.execution.strategy=daemon
# — сборка ускорится в несколько раз.
org.gradle.jvmargs=-Xmx520m -XX:MaxMetaspaceSize=400m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.vfs.watch=false

# Kotlin внутри процесса Gradle — экономит ~500 МБ.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.parallel.tasks.in.project=false

# Не держим в памяти лишнее во время сборки ресурсов.
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.shaders=false
