<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мафия Offline — эскизы интерфейсов (кликабельный прототип)</title>
<style>
:root{
  --bg:#0e0f14; --panel:#171922; --panel2:#1f2230; --line:#2b2f40;
  --txt:#e8eaf2; --dim:#8d93a8; --acc:#7c5cff; --acc2:#a78bfa;
  --ok:#2ecc71; --warn:#f5a623; --bad:#ff4d5e; --night:#2b3a67; --day:#f5c451;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
a{color:var(--acc2)}
header.top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#171922,#0e0f14)}
header.top h1{font-size:19px;margin:0;font-weight:650}
header.top .sub{color:var(--dim);font-size:13px}
.badge{background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:999px;font-size:12px;color:var(--dim)}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:0;min-height:calc(100vh - 64px)}
nav{border-right:1px solid var(--line);padding:16px;background:var(--panel);overflow:auto}
nav h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
nav h3:first-child{margin-top:0}
.navbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--txt);padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13.5px;margin-bottom:3px}
.navbtn:hover{background:var(--panel2)}
.navbtn.active{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.5);color:#fff}
.navbtn .n{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:11px;color:var(--dim);flex:none}
.navbtn.active .n{background:var(--acc);color:#fff}
main{padding:26px 30px;overflow:auto}
.stage{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.notes{max-width:420px;flex:1 1 320px}
.notes h2{margin:0 0 6px;font-size:20px}
.notes .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--acc2);background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.25);padding:3px 8px;border-radius:7px;display:inline-block;margin-bottom:14px}
.notes ul{padding-left:18px;margin:10px 0;color:#c7cbdb}
.notes li{margin-bottom:7px;font-size:13.6px}
.notes .kv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);margin-top:14px}
.notes .kv b{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
code.msg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#ffd479;display:block;white-space:pre-wrap}

/* device frames */
.device{background:#000;border-radius:34px;padding:11px;box-shadow:0 24px 60px rgba(0,0,0,.55);border:1px solid #262a38;flex:none}
.device.phone{width:340px}
.device.tablet{width:430px}
.screen{background:var(--bg);border-radius:25px;overflow:hidden;height:690px;display:flex;flex-direction:column;position:relative}
.device .label{text-align:center;color:var(--dim);font-size:11.5px;padding-top:9px;letter-spacing:.06em;text-transform:uppercase}
.statusbar{display:flex;justify-content:space-between;padding:9px 16px 4px;font-size:11px;color:var(--dim);flex:none}
.appbar{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:none;background:var(--panel)}
.appbar .t{font-weight:650;font-size:15px}
.appbar .r{margin-left:auto;color:var(--dim);font-size:12px}
.body{padding:14px 16px;overflow:auto;flex:1}
.body::-webkit-scrollbar{width:5px}.body::-webkit-scrollbar-thumb{background:#2c3145;border-radius:9px}
.foot{padding:12px 16px;border-top:1px solid var(--line);flex:none;background:var(--panel)}

/* generic ui */
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--acc);color:#fff;font-weight:650;font-size:15px;cursor:pointer}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:550}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn+.btn{margin-top:9px}
.row{display:flex;gap:8px}.row>*{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}
.input{width:100%;padding:11px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--dim)}
.center{display:grid;place-items:center;text-align:center;height:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad)}.dot.warn{background:var(--warn)}

/* role table */
.rrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);font-size:15px;flex:none}
.rrow .nm{flex:1;font-size:14px}
.rrow .nm small{display:block;color:var(--dim);font-size:11px}
.cnt{width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sq{width:29px;height:29px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:17px;line-height:1;cursor:pointer}
.sq:active{background:var(--acc)}
.balance{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:11px;font-size:13px;margin-top:10px}
.balance.ok{background:rgba(46,204,113,.13);border:1px solid rgba(46,204,113,.4);color:#7ff0b0}
.balance.bad{background:rgba(255,77,94,.13);border:1px solid rgba(255,77,94,.45);color:#ff9aa4}

/* players */
.plist{display:flex;flex-direction:column;gap:6px}
.p{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:13.5px}
.p .av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111}
.p .nm{flex:1}
.p .nm small{display:block;color:var(--dim);font-size:11px}
.p.dead{opacity:.42;text-decoration:line-through}
.p.act{border-color:var(--bad);box-shadow:0 0 0 1px rgba(255,77,94,.35) inset}
.p.sel{border-color:var(--acc);background:rgba(124,92,255,.15)}
.p .tick{color:var(--ok);font-weight:700}
.p .x{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:16px}

/* timer */
.timer{font-size:44px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.phasebar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:10px}
.phasebar.night{background:linear-gradient(135deg,#1b2547,#2b3a67)}
.phasebar.day{background:linear-gradient(135deg,#5a4a12,#8a6f1c)}
.phasebar .ph{font-weight:700}
.phasebar .rd{margin-left:auto;font-size:12px;color:#cdd3ea}
.mini{padding:7px 6px;font-size:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);cursor:pointer}

/* log */
.log{background:#101219;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:12px;color:#aab0c6;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:96px;overflow:auto}
.log div{margin-bottom:3px}
.prompt{background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.4);border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:9px}
.prompt b{color:var(--acc2)}

/* voting bars */
.vote{margin-bottom:9px}
.vote .hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:9px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}

/* player role card */
.rolecard{border-radius:16px;padding:16px;text-align:center;background:linear-gradient(160deg,#3b1d33,#241426);border:1px solid #6b2c4e}
.rolecard .em{font-size:40px}
.rolecard .rn{font-size:22px;font-weight:750;margin-top:4px}
.rolecard .rd{font-size:12.5px;color:#e0c3d4;margin-top:5px}
.big{font-size:26px;font-weight:700;text-align:center;margin:10px 0}
.qr{width:150px;height:150px;background:#fff;border-radius:12px;margin:0 auto;display:block}
.code{font-size:38px;font-weight:800;letter-spacing:.16em;text-align:center;font-variant-numeric:tabular-nums}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle{width:44px;height:25px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer}
.toggle i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:.18s}
.toggle.on{background:rgba(124,92,255,.35);border-color:var(--acc)}
.toggle.on i{left:21px;background:var(--acc2)}
.modal{position:absolute;inset:0;background:rgba(5,6,10,.72);display:grid;place-items:center;padding:18px;z-index:5}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-height:92%;overflow:auto}
.sheet h4{margin:0 0 10px;font-size:16px}
.flash{position:absolute;inset:0;background:rgba(255,77,94,.55);pointer-events:none;animation:f .55s ease-out forwards;z-index:9}
@keyframes f{to{opacity:0}}
.flowbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.4px;color:#b9bfd4;white-space:pre;overflow:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="top">
  <h1>🎭 Мафия Offline — эскизы интерфейсов</h1>
  <span class="badge">кликабельный прототип v1</span>
  <span class="sub">Flutter + BLE · экраны ведущего (Android) и игрока (Android/iOS)</span>
</header>

<div class="wrap">
<nav id="nav"></nav>
<main>
  <div class="stage">
    <div id="deviceHost"></div>
    <div class="notes" id="notes"></div>
  </div>
</main>
</div>

<script>
/* ---------------- state ---------------- */
const COLORS=['#FF5733','#33FF57','#3357FF','#FF33A1','#FFD733','#33FFF5','#F533FF','#F5A623','#7ED321','#4A90E2'];
const NAMES=['Анна','Иван','Пётр','Сергей','Мария','Олег','Дина','Костя','Лена','Артём'];
const state={
  screen:'host_menu',
  game:{name:'Игра от 26.07.2026', total:10, code:'482913', round:3},
  roles:{mafia:2,don:1,doctor:1,commissioner:1,prostitute:1,maniac:0},
  players:NAMES.map((n,i)=>({id:'p'+i,name:n,color:COLORS[i],alive:true,connected:true,role:null,acted:false})),
  timer:47, phase:'night', paused:false,
  votes:{p1:3,p4:2,p7:1},
  revealRoles:false,
  sel:null, sent:false, modal:null
};
// раздать роли для демо
(function(){const r=['mafia','mafia','don','doctor','commissioner','prostitute','civilian','civilian','civilian','civilian'];
 state.players.forEach((p,i)=>p.role=r[i]);
 state.players[0].alive=false; state.players[6].alive=false; state.players[3].connected=false;
 state.players[1].acted=true; state.players[2].acted=true;})();

const ROLE_META={
  mafia:{n:'Мафия',e:'🔫',d:'Каждую ночь выбирает жертву для убийства.'},
  don:{n:'Дон',e:'🎩',d:'Глава мафии. Его голос решающий, комиссар видит его как мирного.'},
  doctor:{n:'Доктор',e:'💉',d:'Каждую ночь лечит одного игрока (нельзя себя два раза подряд).'},
  commissioner:{n:'Комиссар',e:'🔎',d:'Каждую ночь проверяет одного игрока на принадлежность к мафии.'},
  prostitute:{n:'Проститутка',e:'💋',d:'Блокирует одного игрока — тот пропускает ночной ход.'},
  maniac:{n:'Маньяк',e:'🔪',d:'Убивает по ночам, играет сам за себя.'},
  civilian:{n:'Мирный житель',e:'👤',d:'Днём голосует и ищет мафию. Ночью спит.'}
};
const alive=()=>state.players.filter(p=>p.alive);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const rolesSum=()=>Object.values(state.roles).reduce((a,b)=>a+b,0);
const civils=()=>state.game.total-rolesSum();

/* ---------------- screens registry ---------------- */
const SCREENS={};
const NAV=[
 {group:'🖥️ Ведущий (Android)',items:[
  ['host_menu','1 · Главное меню'],
  ['host_settings','1a · Настройки'],
  ['host_setup','2 · Создание игры'],
  ['host_lobby','3 · Ожидание игроков'],
  ['host_game','4 · Основной экран (ночь)'],
  ['host_night','5 · Итоги ночи'],
  ['host_vote','6 · Голосование'],
  ['host_end','7 · Конец игры / история'],
 ]},
 {group:'📱 Игрок (Android/iOS)',items:[
  ['pl_connect','1 · Присоединиться'],
  ['pl_wait','2 · Ожидание старта'],
  ['pl_night','3a · Ночь · роль активна'],
  ['pl_sleep','3b · Ночь · «Спите»'],
  ['pl_day','3c · День · обсуждение'],
  ['pl_vote','3d · Голосование'],
  ['pl_dead','4 · Выбывший (зритель)'],
  ['pl_lost','5 · Обрыв связи'],
 ]},
 {group:'🔄 Логика',items:[
  ['flow','Карта переходов + протокол'],
 ]}
];

/* ---------- helpers to build UI ---------- */
function dev(kind,label,inner){return `<div class="device ${kind}"><div class="screen">${inner}</div><div class="label">${label}</div></div>`;}
function bar(title,right=''){return `<div class="statusbar"><span>21:4${state.game.round} </span><span>BLE ▮▮▮ 78%</span></div>
 <div class="appbar"><div class="t">${title}</div><div class="r">${right}</div></div>`;}
function plist(arr,opt={}){return `<div class="plist">${arr.map(p=>{
  const act = opt.active&&opt.active(p);
  const sel = state.sel===p.id&&opt.selectable;
  return `<div class="p ${p.alive?'':'dead'} ${act?'act':''} ${sel?'sel':''}" ${opt.selectable&&p.alive?`onclick="pick('${p.id}')"`:''}>
   <div class="av" style="background:${p.color}">${p.name[0]}</div>
   <div class="nm">${p.name}${opt.sub?`<small>${opt.sub(p)}</small>`:''}</div>
   ${opt.right?opt.right(p):''}</div>`;}).join('')}</div>`;}
function pick(id){state.sel=state.sel===id?null:id;state.sent=false;render();}

/* =========================================================
   ВЕДУЩИЙ
   ========================================================= */
SCREENS.host_menu={dev:'tablet',label:'Ведущий · главное меню',
 notes:{t:'1. Главное меню',p:'features/menu/menu_screen.dart',
  li:['Три входа: «Новая игра», «История игр», «Настройки».','Отдельная кнопка «Я игрок» — тот же APK работает и как клиент.','Проверка Bluetooth/разрешений при старте (permission_handler), баннер если BLE выключен.'],
  kv:['Состояние','currentGameProvider = null → показываем меню; при tap «Новая игра» → route /setup']},
 html:()=>bar('Мафия Offline','v1.0')+`<div class="body">
  <div style="text-align:center;padding:26px 0 18px"><div style="font-size:64px">🎭</div>
   <div style="font-size:24px;font-weight:750;margin-top:6px">Мафия Offline</div>
   <div class="hint">Игра по Bluetooth · без интернета</div></div>
  <div class="card" style="display:flex;gap:8px;align-items:center"><span class="dot"></span><span class="hint">Bluetooth включён · разрешения выданы</span></div>
  <button class="btn" onclick="go('host_setup')">➕ Новая игра</button>
  <button class="btn sec" onclick="go('host_end')">📜 История игр</button>
  <button class="btn sec" onclick="go('host_settings')">⚙️ Настройки</button>
  <button class="btn ghost" onclick="go('pl_connect')">📱 Я игрок — подключиться к игре</button>
 </div><div class="foot"><div class="hint" style="text-align:center">Последняя игра: 24.07 · победа мирных</div></div>`};

SCREENS.host_settings={dev:'tablet',label:'Ведущий · настройки',
 notes:{t:'1a. Настройки',p:'shared_preferences',
  li:['Звук фаз и фоновая музыка — раздельные переключатели (AudioService.toggleSound/ toggleMusic).','Длительности по умолчанию: ночь = 10с + 2с × активных, день = 60с × живых — обе формулы редактируемы.','Тема, вибрация, «показывать роли в списке» (страховка от подглядывания).'],
  kv:['Хранение','SharedPreferences: sound, music, night_base, night_per_player, day_per_player, theme']},
 html:()=>bar('Настройки','← Меню')+`<div class="body">
  <div class="card"><b class="hint">ЗВУК</b>
   <div class="sw">Звуки фаз <div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div>
   <div class="sw">Фоновая музыка <div class="toggle" onclick="this.classList.toggle('on')"><i></i></div></div>
   <div class="sw" style="border:none">Вибро-уведомления <div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div></div>
  <div class="card"><b class="hint">ТАЙМЕРЫ ПО УМОЛЧАНИЮ</b>
   <div class="field" style="margin-top:8px"><label>Ночь: база + на каждого активного</label>
    <div class="row"><input class="input" value="10 с"><input class="input" value="+2 с"></div></div>
   <div class="field" style="margin:0"><label>День: на каждого живого игрока</label><input class="input" value="60 с"></div></div>
  <div class="card"><b class="hint">ИНТЕРФЕЙС</b>
   <div class="sw">Тёмная тема <div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div>
   <div class="sw" style="border:none">Скрывать роли в списке <div class="toggle on" onclick="this.classList.toggle('on')"><i></i></div></div></div>
 </div><div class="foot"><button class="btn" onclick="go('host_menu')">Сохранить</button></div>`};

SCREENS.host_setup={dev:'tablet',label:'Ведущий · создание игры',
 notes:{t:'2. Создание игры (состав ролей)',p:'features/game_setup/game_setup_screen.dart',
  li:['Счётчик игроков 6–20; «Мирные» считаются автоматически: total − Σ(спец. роли).','Красная плашка + заблокированная кнопка, если Σ ролей > числа игроков.','Пресеты для 6-8 / 9-12 / 13-16 / 17-20 подставляют проверенный баланс одним тапом.','Мафия (вместе с доном) не должна быть ≥ ½ состава — валидатор предупреждает.'],
  kv:['Действие','«Создать игру» → generateGameCode() → Game(id, name, availableRoles) → BleService.startHosting(code) → /lobby'],
  code:'{"type":"game_created","code":"482913","name":"Игра от 26.07.2026"}'},
 html:()=>{
  const bad=rolesSum()>state.game.total;
  const R=(k,extra='')=>{const m=ROLE_META[k];return `<div class="rrow"><div class="ico">${m.e}</div>
   <div class="nm">${m.n}<small>${extra||m.d}</small></div>
   <button class="sq" onclick="rl('${k}',-1)">−</button><div class="cnt">${state.roles[k]}</div><button class="sq" onclick="rl('${k}',1)">+</button></div>`;};
  return bar('Новая игра','Шаг 1 из 2')+`<div class="body">
  <div class="field"><label>Название игры</label><input class="input" value="${state.game.name}"></div>
  <div class="card"><div style="display:flex;align-items:center;gap:10px">
    <div style="flex:1"><b>Игроков</b><div class="hint">от 6 до 20</div></div>
    <button class="sq" onclick="tot(-1)">−</button><div class="cnt" style="font-size:20px;width:34px">${state.game.total}</div><button class="sq" onclick="tot(1)">+</button></div></div>
  <div class="card">${R('mafia')}${R('don')}${R('doctor')}${R('commissioner')}${R('prostitute')}${R('maniac')}

function qr(){let s='';let seed=7;const rnd=()=>((seed=seed*1103515245+12345)>>>16)%100;
 for(let y=0;y<21;y++)for(let x=0;x<21;x++){const fin=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
  let on=fin?((x%6===0||y%6===0)||(x>1&&x<5&&y>1&&y<5)):rnd()>52;
  if(fin&&((x===1||x===5)&&y>0&&y<6||(y===1||y===5)&&x>0&&x<6))on=false;
  if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;}
 return s;}

SCREENS.pl_vote={dev:'phone',label:'Игрок · голосование',
 notes:{t:'3d. Голосование',p:'phase = voting',
  li:['Список живых, один тап — один голос, подтверждение кнопкой.','Голос анонимен для других игроков (ведущий видит расшифровку).','Второй тур приходит отдельным пакетом с урезанным списком кандидатов.'],
  code:'→ {"type":"vote","from":"p1","target":"p4"}\n← {"type":"vote_runoff","candidates":["p1","p4"]}'},
 html:()=>{const A=alive().filter(p=>p.name!=='Иван');

  <div style="margin:4px 0 8px;font-weight:650;font-size:14px">Кого отправляем из города?</div>

  code:'← {"type":"eliminated","reason":"vote","round":3}'},

SCREENS.pl_lost={dev:'phone',label:'Игрок · обрыв связи',
 notes:{t:'5. Обрыв и автопереподключение',p:'BleService._attemptReconnect',

SCREENS.flow={dev:null,
 notes:{t:'Карта переходов и протокол BLE',p:'core/router.dart + ble_service.dart',
  li:['Ведущий — один экран на всю партию, модалки поверх него (итоги ночи, лог, правка).','Игрок — один экран, содержимое центральной зоны меняется по phase + isActiveAtNight + isAlive.','Все переходы фаз инициирует только ведущий: клиент рисует то, что пришло в phase.'],
  kv:['Правило','Клиент не хранит игровую логику — он «тонкий»: получил phase → отрисовал, отправил action → заблокировался']},
 html:null};

/* ---------------- render ---------------- */
function go(s){state.screen=s;state.sel=null;state.sent=false;state.modal=null;render();}
function flash(){const sc=document.querySelector('.screen');if(!sc)return;const d=document.createElement('div');d.className='flash';sc.appendChild(d);}
function render(){
  document.getElementById('nav').innerHTML=NAV.map(g=>`<h3>${g.group}</h3>`+g.items.map(([id,t],i)=>
    `<button class="navbtn ${state.screen===id?'active':''}" onclick="go('${id}')"><span class="n">${i+1}</span>${t}</button>`).join('')).join('');
  const S=SCREENS[state.screen];
  document.getElementById('deviceHost').innerHTML = S.html?dev(S.dev,S.label,S.html()):flowHTML();
  const n=S.notes;
  document.getElementById('notes').innerHTML=`<h2>${n.t}</h2><div class="path">${n.p}</div>
   <ul>${n.li.map(x=>`<li>${x}</li>`).join('')}</ul>
   ${n.kv?`<div class="kv"><b>${n.kv[0]}</b>${n.kv[1]}</div>`:''}
   ${n.code?`<div class="kv"><b>Пакеты BLE</b><code class="msg">${n.code}</code></div>`:''}`;
}
function flowHTML(){return `<div class="flowbox" style="max-width:560px">
ВЕДУЩИЙ                                ИГРОК
─────────────────────────────────────  ─────────────────────────
[Главное меню]                         [Присоединиться]
     │ Новая игра                            │ код + имя
     ▼                                       ▼  register ──▶
[Создание игры] ──balance ok──▶        [Ожидание старта]
     │ создать (код + QR)                    ▲
     ▼                                       │ ◀── register_ok
[Ожидание игроков] ◀──── register ───────────┘
     │ Старт  ──── role_assign ─────────▶ роль получена
     ▼                                       ▼
┌─▶[ИГРА · НОЧЬ] ──── night_action ──▶ [Ночь: выбор / «Спите»]
│    │  все ответили либо таймер = 0
│    ▼
│  [Итоги ночи] ─── night_result ────▶ баннер «погиб …»
│    │ Огласить
│    ▼
│  [ИГРА · ДЕНЬ] ─── time_update ────▶ [Обсуждайте]
│    │ Голосование
│    ▼
│  [Голосование] ◀──── vote ───────── [Список кандидатов]
│    │  ничья? ──▶ второй тур (vote_runoff)
│    ▼ Подтвердить ─ eliminated ────▶ [Зритель]
│    │
│    ├─ победа? ──нет──┘ (round++)
│    ▼ да
   [Конец игры] ─── game_over ───────▶ [Итог + расклад ролей]
        │
        ▼ сохранение в SQLite → [История игр]

СЛУЖЕБНЫЕ ПАКЕТЫ (в любой фазе)
  ping / pong        каждые 5 с, таймаут 10 с
  sync               после переподключения: phase, round, time
  pause              заморозка таймера у всех
  kick               исключение из лобби
</div>`;}
render();
setInterval(()=>{if(!state.paused&&state.timer>0&&['host_game','pl_night','pl_sleep'].includes(state.screen)){state.timer--;render();}},1000);
</script>
