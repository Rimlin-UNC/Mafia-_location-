name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Корень Flutter-проекта — папка MafiaOffline/
defaults:
  run:
    working-directory: MafiaOffline

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

  python-tools:
    name: Python game-logic stands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Demo party (20 players)
        run: python3 tools/demo20.py

      - name: Stress (400 parties)
        run: python3 tools/stress.py

      - name: Win rule
        run: python3 tools/winrule.py

      - name: Edge cases
        run: python3 tools/edge.py

      - name: Forced start
        run: python3 tools/forcestart.py

  web-check:
    name: Web client syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        run: |
          node --check assets/web/app.js
          node --check assets/web/sw.js
          echo "Web client JS syntax OK"
