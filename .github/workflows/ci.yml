name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Нужно, чтобы job мог отписать вывод анализатора в PR, если он красный.
permissions:
  contents: read
  pull-requests: write

# Корень Flutter-проекта — папка MafiaOffline/
defaults:
  run:
    working-directory: MafiaOffline

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          # Кэш тулчейна ОТКЛЮЧЁН осознанно.
          #
          # Он весит ~827 МБ на копию. Jobs стартуют одновременно и кэш
          # друг друга не видят, поэтому каждая сборка оставляла свою
          # копию: к 1.10.0 накопилось 4 версии и 3,3 ГБ. Вместе с
          # артефактами это упёрлось в квоту хранилища GitHub — сборка
          # APK проходила, а загрузка падала с «Artifact storage quota has
          # been hit», и CI краснел на ровном месте.
          #
          # Цена отключения — около минуты на `flutter pub get` за job.
          # Цена квоты — красный CI и разбор причины каждый выпуск.
          cache: false

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Вывод анализатора сохраняем в файл: если job упадёт, следующий шаг
      # выложит его в PR — иначе в логах GitHub видно только «exit code 1».
      - name: Static analysis
        id: analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      # Одна публикация на оба шага: в логах GitHub при падении видно только
      # «exit code 1», а по комментарию в PR сразу понятно, что именно упало.
      - name: Publish failure details to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### ❌ CI: подробности падения'
            echo ''
            if [ -s analyze.log ]; then
              echo '#### flutter analyze'
              echo ''
              echo '```'
              # Хвост важнее начала: ошибки печатаются в конце.
              tail -n 200 analyze.log
              echo '```'
              echo ''
            fi
            if [ -s test.log ]; then
              echo '#### flutter test'
              echo ''
              echo '```'
              # Раньше здесь стоял grep по «красивым» строкам. Если он не
              # находил совпадений, конвейер завершался успешно (код
              # возврата даёт tail), `||` не срабатывал — и в PR уезжал
              # пустой блок: падение видно, причины нет.
              #
              # Сначала — выжимка всех падений: тестов бывает больше
              # четырёхсот, и хвост лога обрезал первые из них (ровно так
              # в 1.13.0 спряталось второе падение, и пришлось гонять CI
              # лишний раз). Потом — хвост как был.
              grep -A 12 '❌' test.log | head -n 200 || true
              echo ''
              echo '…'
              echo ''
              tail -n 300 test.log
              echo '```'
            fi
          } > /tmp/ci_comment.md
          # Один и тот же комментарий редактируем, а не плодим новые.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none --body-file /tmp/ci_comment.md \
            || gh pr comment "${{ github.event.pull_request.number }}" \
                 --body-file /tmp/ci_comment.md

  python-tools:
    name: Python game-logic stands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Demo party (20 players)
        run: python3 tools/demo20.py

      - name: Stress (400 parties)
        run: python3 tools/stress.py

      - name: Win rule
        run: python3 tools/winrule.py

      - name: Edge cases
        run: python3 tools/edge.py

      - name: Forced start
        run: python3 tools/forcestart.py

      - name: Table rules 1.2.0 / 1.3.0 (intro night, last word + re-vote, instant check)
        run: python3 tools/rules120.py

      # ---- Отказоустойчивость и нагрузка ---------------------------------
      # До 1.9.2 эти стенды запускались только руками: обрыв Wi-Fi у всех
      # 20 игроков, возврат из фона, ход в момент разрыва, вторая вкладка.
      # Это ровно те сценарии, из-за которых партия разваливается за столом,
      # и проверять их «когда-нибудь» нельзя.
      - name: Install websockets (resilience stands)
        run: pip install --quiet websockets

      - name: Resilience (drops, background return, duplicate tabs)
        run: python3 tools/resilience.py

      - name: Load (20 players join at once, response time)
        run: python3 tools/load20.py

      # Версия в pubspec обязана иметь свой CHANGELOG: release.yml берёт
      # номер версии оттуда же, и релиз без описания выпускать нельзя.
      # Карточки правил для браузера лежат в assets/*/web/ и собираются
      # tools/web_images.py. Если карточку добавили, а копию для веба — нет,
      # игрок увидит в книге правил пустую рамку. Проверяем до сборки:
      # Pillow нужен один, ставится за секунды.
      - name: Web images are fresh (rules book in browser)
        run: |
          pip install --quiet pillow numpy
          python3 tools/web_images.py --check

      # Иконку не проверяет ни analyze, ни сборка APK: битая иконка видна
      # только на телефоне. Проверяем то, на чём ломались: прозрачные углы
      # диска, отсутствие линий по кромке, незалитый монохром, отсутствие
      # альфы у iOS и размеры слоёв адаптивной иконки.
      - name: App icon is consistent
        run: python3 tools/make_icon.py --verify

      - name: Version has a changelog
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "pubspec version: $VERSION"
          if [ ! -s "docs/CHANGELOG_${VERSION}.md" ]; then
            echo "::error::нет docs/CHANGELOG_${VERSION}.md для версии из pubspec.yaml"
            exit 1
          fi

  web-check:
    name: Web client syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JS syntax
        run: |
          node --check assets/web/app.js
          node --check assets/web/sw.js
          # `///` — это док-комментарий Dart, но не JavaScript. В браузере
          # такая строка превращается в три деления подряд и роняет скрипт
          # с SyntaxError — при этом `node --check` спокойно пропускает её
          # как «деление-деление-деление» в некоторых позициях. Ловим явно.
          if grep -rn '^[[:space:]]*///' assets/web/*.js; then
            echo '::error::в JS найдены док-комментарии Dart (///) — это не синтаксис JavaScript'
            exit 1
          fi
          echo "Web client JS syntax OK"

      # Синтаксиса мало: обработчик пакетов в app.js глотает исключения,
      # и опечатка в id элемента даёт игроку пустой экран без единой ошибки.
      # Тест загружает настоящие index.html и app.js в jsdom и проходит
      # партию пакет за пакетом.
      - name: Web client smoke test (jsdom)
        run: |
          npm install --no-save --no-audit --no-fund jsdom@31.0.0
          node tools/web_smoke.js

  # Сборка APK на каждый PR. До 1.3.0 приложение собиралось только по тегу
  # (release.yml): «анализ и тесты зелёные» не значило «APK собирается»,
  # и сломанную сборку находили уже после слияния. Шаги повторяют release.yml,
  # чтобы проверялось ровно то, что потом уйдёт в релиз.
  build-apk:
    name: Build release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          # Кэш тулчейна ОТКЛЮЧЁН осознанно.
          #
          # Он весит ~827 МБ на копию. Jobs стартуют одновременно и кэш
          # друг друга не видят, поэтому каждая сборка оставляла свою
          # копию: к 1.10.0 накопилось 4 версии и 3,3 ГБ. Вместе с
          # артефактами это упёрлось в квоту хранилища GitHub — сборка
          # APK проходила, а загрузка падала с «Artifact storage quota has
          # been hit», и CI краснел на ровном месте.
          #
          # Цена отключения — около минуты на `flutter pub get` за job.
          # Цена квоты — красный CI и разбор причины каждый выпуск.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Speed up Gradle in CI
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/org.gradle.daemon=false/org.gradle.daemon=true/' android/gradle.properties
          sed -i 's/org.gradle.parallel=false/org.gradle.parallel=true/' android/gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=4/' android/gradle.properties
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/' android/gradle.properties
          sed -i 's/kotlin.incremental=false/kotlin.incremental=true/' android/gradle.properties

      - name: Build arm64 APK
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee apk-build.log
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MafiaOffline-${VERSION}-arm64-ci.apk"
          ls -lh dist/
          # Пустой или обрезанный файл — не сборка. Настоящий APK весит десятки мегабайт.
          SIZE=$(stat -c%s "dist/MafiaOffline-${VERSION}-arm64-ci.apk")
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::APK подозрительно мал: $SIZE байт"
            exit 1
          fi

      - name: Publish APK failure details
        if: failure() && steps.apk.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Ошибка сборки APK'
            echo '```'
            tail -n 160 apk-build.log
            echo '```'
          } > /tmp/apk-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/apk-comment.md

      # Сборку можно скачать со страницы запуска и поставить на телефон
      # до слияния. Подпись — debug-ключ, как и у релизов.
      #
      # defaults.run.working-directory действует только на run, не на uses.
      # upload-artifact ищет от корня checkout: нужен MafiaOffline/dist/.
      #
      # continue-on-error: артефакт — удобство, а не проверка. Квота
      # хранилища общая на аккаунт и может быть занята другим проектом;
      # из-за этого CI краснел при полностью успешной сборке APK. Сборка,
      # размер и подпись проверены выше — этого достаточно.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MafiaOffline-${{ env.VERSION }}-arm64-ci
          path: MafiaOffline/dist/*.apk
          retention-days: 14
          if-no-files-found: warn
